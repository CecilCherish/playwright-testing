name: Playwright SauceDemo E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate SIT Excel Report
        run: npm run generate:sit

      - name: Run Playwright E2E Tests (Headless)
        run: npm test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload SIT Matrix Excel Document
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sit-excel-matrix
          path: docs/SIT_SauceDemo_TestScenarios.xlsx
          retention-days: 30

